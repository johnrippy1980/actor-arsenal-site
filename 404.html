<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Actor Arsenal</title>
    <meta name="description" content="The page you're looking for has been slain by demons.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        /* ===== TOP NAVIGATION BAR ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #5a5a5a 0px, #5a5a5a 2px,
                    #6a6a6a 2px, #6a6a6a 4px,
                    #4a4a4a 4px, #4a4a4a 6px,
                    #555 6px, #555 8px
                ),
                linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
            border-bottom: 4px solid #2a2a2a;
            border-top: 4px solid #7a7a7a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            padding: 0 1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .nav-logo img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
        }
        .nav-logo span {
            font-size: 0.6rem;
            color: #ff3366;
            text-shadow: 2px 2px 0 #000;
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
        }
        .nav-link {
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border: 2px solid #6a6a6a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            color: #00ff88;
            padding: 0.4rem 0.8rem;
            text-decoration: none;
            font-size: 0.5rem;
            text-shadow: 1px 1px 0 #000;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
            transform: translateY(-2px);
            color: #ffcc00;
        }
        .nav-link.doom-link {
            color: #ff3366;
            border-color: #ff3366;
            animation: doomPulse 1s ease-in-out infinite;
        }
        @keyframes doomPulse {
            0%, 100% { box-shadow: 0 0 5px #ff3366; }
            50% { box-shadow: 0 0 15px #ff3366, 0 0 25px #8B0000; }
        }

        /* DOOM Death Screen Pattern - Pixelated blocky background */
        .death-screen {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            height: calc(100% - 130px);
            z-index: -1;
            background-color: #8B0000;
        }

        /* SVG for the actual blocky death pattern */
        .doom-death-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            margin-top: 80px;
            margin-bottom: 100px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Dead Doomguy face - Using sprite sheet position for dead face */
        .dead-face {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            image-rendering: pixelated;
            animation: faceFlicker 0.5s ease-in-out infinite;
        }

        @keyframes faceFlicker {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.8; }
        }

        .error-code {
            font-size: 5rem;
            color: #ff3333;
            text-shadow:
                4px 4px 0 #000,
                8px 8px 0 #660000;
            margin-bottom: 0.5rem;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-message {
            font-size: 1.2rem;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .error-subtitle {
            font-size: 0.6rem;
            color: #cc9966;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 1.5rem;
            max-width: 500px;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .home-link {
            display: inline-block;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border: 3px solid #6a6a6a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            color: #00ff88;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
            cursor: pointer;
        }

        .home-link:hover {
            background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .home-link:active {
            transform: translateY(0);
        }

        .home-link.compare { color: #ffcc00; }
        .home-link.api { color: #9933ff; }

        /* ===== DOOM HUD (Classic Grey Metal Style) ===== */
        .doom-hud {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #5a5a5a 0px, #5a5a5a 2px,
                    #6a6a6a 2px, #6a6a6a 4px,
                    #4a4a4a 4px, #4a4a4a 6px,
                    #555 6px, #555 8px
                ),
                linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
            border-top: 4px solid #7a7a7a;
            border-bottom: 4px solid #2a2a2a;
            box-shadow:
                inset 0 2px 0 #8a8a8a,
                inset 0 -2px 0 #2a2a2a,
                0 -4px 8px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            font-family: 'Press Start 2P', cursive;
            padding: 0;
            gap: 0;
        }
        .hud-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background:
                linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border-left: 3px solid #6a6a6a;
            border-right: 3px solid #2a2a2a;
            border-top: 2px solid #7a7a7a;
            border-bottom: 2px solid #1a1a1a;
            padding: 0 1.5rem;
            position: relative;
        }
        .hud-section::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 2px solid #1a1a1a;
            border-radius: 2px;
            z-index: -1;
        }
        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 0.5rem;
        }
        .hud-value {
            font-size: 1.8rem;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
            letter-spacing: 2px;
        }
        .hud-label {
            font-size: 0.5rem;
            color: #888;
            text-shadow: 1px 1px 0 #000;
            text-transform: uppercase;
        }
        .hud-face-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 3px solid #5a5a5a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 1rem;
            overflow: hidden;
        }
        .hud-face {
            width: 60px;
            height: 60px;
            image-rendering: pixelated;
        }
        .hud-health { color: #ff3333; }
        .hud-armor { color: #00ff88; }

        /* CRT Scanline effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.5;
        }

        /* Red vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* ===== APIFY AFFILIATE BADGE ===== */
        .apify-affiliate {
            position: fixed;
            bottom: 90px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00d4aa;
            padding: 0.4rem 0.8rem;
            text-decoration: none;
            z-index: 1000;
            transition: all 0.3s;
        }
        .apify-affiliate:hover {
            background: rgba(0, 212, 170, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.3);
        }
        .apify-affiliate img {
            height: 20px;
            filter: brightness(0) invert(1);
        }
        .apify-affiliate span {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.4rem;
            color: #00d4aa;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 3rem; }
            .error-message { font-size: 0.9rem; }
            .nav-links { display: none; }
            .hud-section { padding: 0 0.5rem; }
            .hud-value { font-size: 1.2rem; }
            .nav-buttons { flex-direction: column; }
        }
    </style>

    <script>
        // Play death sound on load
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playDeathSound() {
            if (!audioCtx) audioCtx = new AudioContext();

            // Descending death sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // Play sound on first interaction
        document.addEventListener('click', () => {
            playDeathSound();
        }, { once: true });
    </script>
