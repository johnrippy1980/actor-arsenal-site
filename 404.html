<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Actor Arsenal</title>
    <meta name="description" content="The page you're looking for has been slain by demons.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border: #222222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }

        /* Navigation */
        nav {
            background: rgba(10, 10, 10, 0.95);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        nav .container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; transition: color 0.3s; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--accent-green); }
        .logo {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        .logo-img { height: 32px; image-rendering: pixelated; }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 2rem 120px;
            position: relative;
            z-index: 10;
        }

        /* DOOM Death Screen Pattern */
        .death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #8B0000;
        }

        /* SVG for the blocky death pattern */
        .doom-death-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
        }

        /* Dead Doomguy face - pixel art SVG */
        .dead-face {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            image-rendering: pixelated;
            animation: faceFlicker 0.5s ease-in-out infinite;
        }

        @keyframes faceFlicker {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.8; }
        }

        .error-code {
            font-size: 6rem;
            color: #ff3333;
            text-shadow:
                4px 4px 0 #000,
                8px 8px 0 #660000;
            margin-bottom: 1rem;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-message {
            font-size: 1.5rem;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .error-subtitle {
            font-size: 0.8rem;
            color: #cc9966;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .home-link {
            display: inline-block;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border: 3px solid #6a6a6a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            color: #00ff88;
            padding: 1rem 2rem;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
            cursor: pointer;
            margin: 0.5rem;
        }

        .home-link:hover {
            background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .home-link:active {
            transform: translateY(0);
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        /* CRT Scanline effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.5;
        }

        /* Red vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* DOOM HUD */
        .doom-hud {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #5a5a5a 0px, #5a5a5a 2px,
                    #6a6a6a 2px, #6a6a6a 4px,
                    #4a4a4a 4px, #4a4a4a 6px,
                    #555 6px, #555 8px
                ),
                linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
            border-top: 4px solid #7a7a7a;
            border-bottom: 4px solid #2a2a2a;
            box-shadow:
                inset 0 2px 0 #8a8a8a,
                inset 0 -2px 0 #2a2a2a,
                0 -4px 8px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            font-family: 'Press Start 2P', cursive;
            padding: 0;
            gap: 0;
        }
        .hud-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border-left: 3px solid #6a6a6a;
            border-right: 3px solid #2a2a2a;
            border-top: 2px solid #7a7a7a;
            border-bottom: 2px solid #1a1a1a;
            padding: 0 1.5rem;
            position: relative;
        }
        .hud-section::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 2px solid #1a1a1a;
            border-radius: 2px;
            z-index: -1;
        }
        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 0.5rem;
        }
        .hud-value {
            font-size: 1.8rem;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
            letter-spacing: 2px;
        }
        .hud-label {
            font-size: 0.5rem;
            color: #888;
            text-shadow: 1px 1px 0 #000;
            text-transform: uppercase;
        }
        .hud-face-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 3px solid #5a5a5a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            display: flex;
            align-items: center;

        .hud-face {

        .hud-health { color: #ff3333; }

        /* Apify Affiliate */

        .apify-affiliate:hover {

        @media (max-width: 768px) {
            .error-code { font-size: 4rem; }
            .error-message { font-size: 1rem; }
            .nav-links a:not(:first-child) { display: none; }
            .hud-section { padding: 0 0.5rem; }
            .hud-value { font-size: 1.2rem; }
        }
    </style>

    <script>
        // Play death sound on load
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playDeathSound() {
            if (!audioCtx) audioCtx = new AudioContext();

            // Descending death sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // Play sound on first interaction
        document.addEventListener('click', () => {
            playDeathSound();
        }, { once: true });
    </script>
