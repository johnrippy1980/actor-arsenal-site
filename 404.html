    <link rel="icon" type="image/png" href="images/logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* DOOM Death Screen Pattern - Pixelated blocky background */
        .death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #8B0000;
        }

        /* Generate the blocky death pattern with CSS */
        .death-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                /* Red blocks */
                linear-gradient(90deg, #cc3300 0%, #cc3300 100%),
                /* Orange/tan blocks scattered */
                radial-gradient(ellipse 80px 60px at 10% 20%, #cc9966 0%, #cc9966 100%),
                radial-gradient(ellipse 60px 80px at 25% 15%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 100px 70px at 40% 25%, #cc6633 0%, #cc6633 100%),
                radial-gradient(ellipse 70px 90px at 60% 10%, #cc9966 0%, #cc9966 100%),
                radial-gradient(ellipse 90px 60px at 80% 20%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 80px 70px at 95% 15%, #cc6633 0%, #cc6633 100%),
                /* More tan/brown scattered */
                radial-gradient(ellipse 60px 80px at 5% 45%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 90px 70px at 20% 55%, #cc9966 0%, #cc9966 100%),
                radial-gradient(ellipse 70px 60px at 35% 40%, #663300 0%, #663300 100%),
                radial-gradient(ellipse 80px 90px at 50% 50%, #cc6633 0%, #cc6633 100%),
                radial-gradient(ellipse 60px 70px at 70% 45%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 100px 80px at 85% 55%, #cc9966 0%, #cc9966 100%),
                /* Bottom section more brown */
                radial-gradient(ellipse 90px 100px at 15% 80%, #663300 0%, #663300 100%),
                radial-gradient(ellipse 80px 70px at 30% 90%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 100px 80px at 55% 85%, #663300 0%, #663300 100%),
                radial-gradient(ellipse 70px 90px at 75% 75%, #996633 0%, #996633 100%),
                radial-gradient(ellipse 90px 70px at 90% 85%, #663300 0%, #663300 100%);
            background-size: 100% 100%;
            opacity: 0.9;
        }

        /* Pixelated overlay using canvas-like blocks */
        .pixel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 20px,
                    rgba(0,0,0,0.1) 20px,
                    rgba(0,0,0,0.1) 40px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 20px,
                    rgba(0,0,0,0.1) 20px,
                    rgba(0,0,0,0.1) 40px
                );
            image-rendering: pixelated;
        }

        /* SVG for the actual blocky death pattern */
        .doom-death-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
        }

        /* Dead Doomguy face - pixel art SVG */
        .dead-face {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            image-rendering: pixelated;
            animation: faceFlicker 0.5s ease-in-out infinite;
        }

        @keyframes faceFlicker {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.8; }
        }

        .error-code {
            font-size: 6rem;
            color: #ff3333;
            text-shadow:
                4px 4px 0 #000,
                8px 8px 0 #660000;
            margin-bottom: 1rem;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-message {
            font-size: 1.5rem;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .error-subtitle {
            font-size: 0.8rem;
            color: #cc9966;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .home-link {
            display: inline-block;

            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;

            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
            cursor: pointer;
        }

        .home-link:hover {
            background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .home-link:active {
            transform: translateY(0);
        }

        /* CRT Scanline effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.5;
        }

        /* Red vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.6) 100%);
        }
    </style>
</head>

    <script>
        // Play death sound on load
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playDeathSound() {
            if (!audioCtx) audioCtx = new AudioContext();

            // Descending death sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // Play sound on first interaction
        document.addEventListener('click', () => {
            playDeathSound();
        }, { once: true });
