    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-purple: #9933ff;
            --accent-yellow: #ffcc00;
            --accent-blood: #8B0000;
            --blood-red: #cc0000;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border: #222222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background: #000;
            padding-bottom: 90px;
        }

        /* ===== NAVIGATION (Matching index.html) ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 0.8rem 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo-img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--accent-green); }
        .cta-button {
            background: var(--accent-green);
            color: #000;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .cta-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        /* ===== DIFFICULTY SELECTOR ===== */
        .difficulty-selector {
            position: relative;
            display: inline-block;
        }
        .difficulty-btn, .music-btn {
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.4rem 0.8rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .music-btn {
            font-size: 1.2rem;
            padding: 0.4rem 0.8rem;
            margin-left: 0.5rem;
            border: 2px solid var(--accent-yellow);
            color: var(--accent-yellow);
            background: rgba(255, 204, 0, 0.1);
            animation: musicPulse 2s ease-in-out infinite;
            position: relative;
        }
        .music-btn::after {
            content: 'E1M1';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.4rem;
            color: var(--accent-yellow);
            white-space: nowrap;
        }
        .music-btn.playing {
            background: var(--accent-yellow);
            color: #000;
            animation: none;
            box-shadow: 0 0 15px var(--accent-yellow);
        }
        .music-btn.playing::after {
            content: 'PLAYING';
        }
        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 5px var(--accent-yellow); }
            50% { box-shadow: 0 0 20px var(--accent-yellow), 0 0 30px var(--accent-red); }
        }
        .difficulty-btn:hover, .music-btn:hover {
            background: var(--accent-red);
            color: #000;
        }
        .music-btn:hover {
            background: var(--accent-yellow);
            color: #000;
        }
        .difficulty-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: #111;
            border: 1px solid var(--accent-red);
            display: none;
            flex-direction: column;
            min-width: 200px;
            z-index: 1002;
        }
        .difficulty-menu.show { display: flex; }
        .difficulty-option {
            padding: 0.8rem;
            color: #888;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            transition: all 0.2s;
        }
        .difficulty-option:hover {
            background: var(--accent-red);
            color: #000;
        }
        .difficulty-option.active {
            color: var(--accent-yellow);
        }

        /* DOOM Death Screen Pattern - Pixelated blocky background */
        .death-screen {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 140px);
            z-index: -1;
            background-color: #8B0000;
        }

        /* SVG for the actual blocky death pattern */
        .doom-death-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            margin-top: 100px;
            margin-bottom: 100px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Dead Doomguy face - Actual PNG sprite */
        .dead-face {
            width: 144px;
            height: 174px;
            margin: 0 auto 1.5rem;
            image-rendering: pixelated;
            animation: faceFlicker 0.5s ease-in-out infinite;
        }

        @keyframes faceFlicker {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.8; }
        }

        .error-code {
            font-size: 5rem;
            color: #ff3333;
            text-shadow:
                4px 4px 0 #000,
                8px 8px 0 #660000;
            margin-bottom: 0.5rem;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-message {
            font-size: 1.2rem;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .error-subtitle {
            font-size: 0.6rem;
            color: #cc9966;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 1.5rem;
            max-width: 500px;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .home-link {
            display: inline-block;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border: 3px solid #6a6a6a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            color: #00ff88;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
            cursor: pointer;
        }

        .home-link:hover {
            background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .home-link:active {
            transform: translateY(0);
        }

        .home-link.compare { color: #ffcc00; }
        .home-link.api { color: #9933ff; }
        .home-link.doom { color: #ff3366; }

        /* ===== DOOM HUD (Classic Grey Metal Style) ===== */
        .doom-hud {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #5a5a5a 0px, #5a5a5a 2px,
                    #6a6a6a 2px, #6a6a6a 4px,
                    #4a4a4a 4px, #4a4a4a 6px,
                    #555 6px, #555 8px
                ),
                linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
            border-top: 4px solid #7a7a7a;
            border-bottom: 4px solid #2a2a2a;
            box-shadow:
                inset 0 2px 0 #8a8a8a,
                inset 0 -2px 0 #2a2a2a,
                0 -4px 8px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            font-family: 'Press Start 2P', cursive;
            padding: 0;
            gap: 0;
        }
        .hud-section {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background:
                linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border-left: 3px solid #6a6a6a;
            border-right: 3px solid #2a2a2a;
            border-top: 2px solid #7a7a7a;
            border-bottom: 2px solid #1a1a1a;
            padding: 0 1.5rem;
            position: relative;
        }
        .hud-section::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 2px solid #1a1a1a;
            border-radius: 2px;
            z-index: -1;
        }
        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 0.5rem;
        }
        .hud-value {
            font-size: 1.8rem;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
            letter-spacing: 2px;
        }
        .hud-label {
            font-size: 0.5rem;
            color: #888;
            text-shadow: 1px 1px 0 #000;
            text-transform: uppercase;
        }
        .hud-face-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border: 3px solid #5a5a5a;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 1rem;
        }
        .hud-face {
            width: 60px;
            height: 60px;
            image-rendering: pixelated;
        }
        .hud-ammo { color: #ffcc00; }
        .hud-health { color: #ff3333; }
        .hud-armor { color: #00ff88; }
        .hud-secrets { color: #ff6600; }

        /* CRT Scanline effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.6;
        }

        /* Red vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9997;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(139, 0, 0, 0.4) 100%);
        }

        /* ===== APIFY AFFILIATE BADGE ===== */
        .apify-affiliate {
            position: fixed;
            bottom: 90px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00d4aa;
            padding: 0.4rem 0.8rem;
            text-decoration: none;
            z-index: 1000;
            transition: all 0.3s;
        }
        .apify-affiliate:hover {
            background: rgba(0, 212, 170, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.3);
        }
        .apify-affiliate img {
            height: 20px;
            filter: brightness(0) invert(1);
        }
        .apify-affiliate span {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.4rem;
            color: #00d4aa;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 3rem; }
            .error-message { font-size: 0.9rem; }
            .nav-links { display: none; }
            .hud-section { padding: 0 0.5rem; }
            .hud-value { font-size: 1.2rem; }
            .nav-buttons { flex-direction: column; }
            .dead-face { width: 96px; height: 116px; }
        }
    </style>
</head>

    <script>
        // DOOM Theme Music (E1M1 - At Doom's Gate)
        const doomMusic = new Audio('sounds/e1m1.mp3');
        doomMusic.loop = true;
        doomMusic.volume = 0.3;
        let musicPlaying = false;

        // Check if music was playing on previous page
        const musicBtn = document.getElementById('musicBtn');
        if (localStorage.getItem('doomMusicPlaying') === 'true') {
            const savedTime = parseFloat(localStorage.getItem('doomMusicTime') || '0');
            doomMusic.currentTime = savedTime;
            doomMusic.play().then(() => {
                musicPlaying = true;
                musicBtn.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(() => {});
        }

        // Save music time periodically
        setInterval(() => {
            if (musicPlaying) {
                localStorage.setItem('doomMusicTime', doomMusic.currentTime.toString());
            }
        }, 1000);

        // Save music state before leaving page
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('doomMusicPlaying', musicPlaying.toString());
            localStorage.setItem('doomMusicTime', doomMusic.currentTime.toString());
        });

        function toggleMusic() {
            if (musicPlaying) {
                doomMusic.pause();
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
                musicPlaying = false;
                localStorage.setItem('doomMusicPlaying', 'false');
            } else {
                doomMusic.play().then(() => {
                    musicBtn.textContent = '🔊';
                    musicBtn.classList.add('playing');
                    musicPlaying = true;
                    localStorage.setItem('doomMusicPlaying', 'true');
                }).catch(() => {});
            }
        }

        // Difficulty selector
        const difficultyBtn = document.getElementById('difficultyBtn');
        const difficultyMenu = document.getElementById('difficultyMenu');
        const difficultyOptions = document.querySelectorAll('.difficulty-option');

        difficultyBtn.addEventListener('click', () => {
            difficultyMenu.classList.toggle('show');
        });

        difficultyOptions.forEach(option => {
            option.addEventListener('click', () => {
                difficultyOptions.forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                difficultyBtn.textContent = option.textContent;
                difficultyMenu.classList.remove('show');
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.difficulty-selector')) {
                difficultyMenu.classList.remove('show');
            }
        });

        // Play death sound on load
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playDeathSound() {
            if (!audioCtx) audioCtx = new AudioContext();

            // Descending death sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // Play death sound on first interaction
        document.addEventListener('click', () => {
            playDeathSound();
        }, { once: true });
    </script>
